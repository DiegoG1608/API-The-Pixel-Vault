spring.application.name=thepixelvault
#Linea que indica la url del servidor de mysql
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#create-drop solo recomendada para desarrollo
spring.jpa.hibernate.ddl-auto=${PROD_DDL}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#para visualizar las consultas sql que se realizan
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#JWT Cosas
jwt.secret=${JWT_KEY}
#El tiempo de expiracion del tocken es en milisegundos, tenemos 24 horas puestas
jwt.expiration=86400000